<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-indigo-600 text-white rounded-2xl p-6 mb-6 shadow-lg">
            <h1 class="text-3xl font-bold">Daily Task Manager</h1>
            <p class="mt-2 text-indigo-100">
                Plan and manage your academic and personal tasks
            </p>
        </div>
        <div class="grid md:grid-cols-3 gap-6">
            <div class="md:col-span-1 bg-white rounded-xl shadow p-5">
                <h2 class="text-xl font-bold mb-4">Add New Task</h2>
                <input
                    id="taskInput"
                    type="text"
                    placeholder="Enter task"
                    class="w-full border rounded-lg px-3 py-2 mb-3 focus:ring-2 focus:ring-indigo-500 outline-none"
                >
                <select
                    id="priority"
                    class="w-full border rounded-lg px-3 py-2 mb-3"
                >
                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
                <button
                    onclick="addTask()"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700"
                >
                    Add Task
                </button>
            </div>
            <div class="md:col-span-2 bg-white rounded-xl shadow p-5">
                <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
                    <h2 class="text-xl font-bold">My Tasks</h2>
                    <div class="flex gap-2">
                        <button
                            onclick="showAll()"
                            class="px-3 py-1 bg-gray-200 rounded-lg text-sm"
                        >
                            All
                        </button>
                        <button
                            onclick="showPending()"
                            class="px-3 py-1 bg-yellow-100 rounded-lg text-sm"
                        >
                            Pending
                        </button>
                        <button
                            onclick="showCompleted()"
                            class="px-3 py-1 bg-green-100 rounded-lg text-sm"
                        >
                            Completed
                        </button>
                    </div>
                </div>
                <div
                    id="taskList"
                    class="space-y-3"
                ></div>
                <p
                    id="emptyMessage"
                    class="text-center text-gray-400 py-8"
                >
                    No tasks available.
                </p>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-4 mt-6">
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <p class="text-gray-500 text-sm">Total</p>
                <p id="totalCount" class="text-2xl font-bold text-indigo-600">0</p>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <p class="text-gray-500 text-sm">Pending</p>
                <p id="pendingCount" class="text-2xl font-bold text-yellow-500">0</p>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <p class="text-gray-500 text-sm">Completed</p>
                <p id="completedCount" class="text-2xl font-bold text-green-500">0</p>
            </div>
        </div>
    </div>
    <script>
        let tasks = [];
        function addTask() {
            const input = document.getElementById("taskInput");
            const priority = document.getElementById("priority");
            const text = input.value.trim();
            if (text === "") {
                alert("Please enter a task.");
                return;
            }
            tasks.push({
                text: text,
                priority: priority.value,
                completed: false
            });
            input.value = "";
            displayTasks(tasks);
        }
        function displayTasks(list) {
            const taskList = document.getElementById("taskList");
            const emptyMessage = document.getElementById("emptyMessage");
            taskList.innerHTML = "";
            if (list.length === 0) {
                emptyMessage.classList.remove("hidden");
            } else {
                emptyMessage.classList.add("hidden");
            }
            list.forEach((task, index) => {
                const item = document.createElement("div");
                let priorityClass = "";
                if (task.priority === "High") {
                    priorityClass = "bg-red-100 text-red-600";
                } else if (task.priority === "Medium") {
                    priorityClass = "bg-yellow-100 text-yellow-600";
                } else {
                    priorityClass = "bg-green-100 text-green-600";
                }
                item.className =
                    "flex items-center justify-between gap-3 border rounded-lg p-3";
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input
                            type="checkbox"
                            class="w-5 h-5"
                            ${task.completed ? "checked" : ""}
                            onchange="toggleTask(${index})"
                        >
                        <div>
                            <p class="${
                                task.completed
                                ? "line-through text-gray-400"
                                : "text-gray-700"
                            } font-medium">
                                ${task.text}
                            </p>
                            <span class="${priorityClass} text-xs px-2 py-1 rounded-full">
                                ${task.priority}
                            </span>
                        </div>
                    </div>
                    <button
                        onclick="deleteTask(${index})"
                        class="text-red-500 hover:text-red-700 font-medium"
                    >
                        Delete
                    </button>
                `;
                taskList.appendChild(item);
            });
            updateCounts();
        }
        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            displayTasks(tasks);
        }
        function deleteTask(index) {
            tasks.splice(index, 1);
            displayTasks(tasks);
        }
        function showAll() {
            displayTasks(tasks);
        }
        function showPending() {
            displayTasks(tasks.filter(task => !task.completed));
        }
        function showCompleted() {
            displayTasks(tasks.filter(task => task.completed));
        }
        function updateCounts() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const pending = total - completed;
            document.getElementById("totalCount").textContent = total;
            document.getElementById("pendingCount").textContent = pending;
            document.getElementById("completedCount").textContent = completed;
        }
    </script>
</body>
</html>
